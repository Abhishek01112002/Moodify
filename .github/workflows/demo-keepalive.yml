name: Demo Keepalive

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake Streamlit demo
        run: |
          curl --fail --silent --show-error --max-time 30 https://moodify-byabhishek.streamlit.app/ > /dev/null
